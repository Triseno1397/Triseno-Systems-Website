*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0d0c11;--card:#15131b;--card2:#1c1a24;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --ink:#eeebf4;--mute:#9c96aa;--accent:#a874ff;--accent-ink:#0d0c11;--danger:#ff6b81;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;--sans:'Geist',system-ui,-apple-system,sans-serif;
  --display:'Unbounded','Arial Black',sans-serif;--hand:'Caveat','Bradley Hand','Segoe Print',cursive;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 80px}
.wrap{max-width:1240px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- editor chrome ---------- */
.top{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;padding-block:36px 22px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.brand .eyebrow i{width:10px;height:10px;border:1.5px solid var(--accent);display:inline-block}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,40px);letter-spacing:.02em;text-transform:uppercase;line-height:1.05;margin:10px 0 0;text-wrap:balance}
.brand h1 em{font-family:var(--hand);font-style:normal;font-weight:700;text-transform:none;color:var(--accent);letter-spacing:0;font-size:1.15em;margin-left:.15em}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line2);background:transparent;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger);border-color:rgba(255,107,129,.5)}
.btn:disabled{opacity:.45;cursor:default}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;padding-block:20px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field input,.field textarea,.field select{background:var(--card2);border:1px solid var(--line);padding:9px 11px;min-width:0;width:100%;box-sizing:border-box}
.field textarea{resize:vertical;min-height:64px;line-height:1.35}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:var(--card2);border:0;padding:9px 10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.help{display:flex;flex-wrap:wrap;gap:8px 26px;padding-block:16px;color:var(--mute);font-size:13.5px}
.help b{color:var(--ink);font-weight:500}
.help span{display:block;padding-left:17px;position:relative}
.help span::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border:1.5px solid var(--accent)}

.slides{display:flex;flex-direction:column;gap:34px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line)}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-head .label{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:12px;align-items:center}
.card-head .label b{font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--accent);font-weight:600}
.card-head .tools{display:flex;flex-wrap:wrap;gap:6px}
.card-head .tools .btn{padding:7px 11px;font-size:11px}
.stage{position:relative;width:100%;overflow:hidden;background:#000;touch-action:pan-y}
.stage.drop{outline:3px dashed var(--accent);outline-offset:-3px}
details.edit{border-top:1px solid var(--line)}
details.edit summary{cursor:pointer;padding:12px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);list-style:none;display:flex;justify-content:space-between}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary::after{content:"+";color:var(--ink)}
details.edit[open] summary::after{content:"–"}
.edit-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;padding:4px 14px 18px}
.edit-body .group{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-top:6px;border-top:1px solid var(--line);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.edit-body .group button{background:none;border:0;color:var(--danger);font:inherit;letter-spacing:inherit;padding:0}
.add-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;padding:11px 16px;transition:opacity .3s,transform .3s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow"><i></i>Triseno / Web Design</div>
      <h1>Breakdown carousel<em>builder</em></h1>
    </div>
    <div class="actions">
      <button class="btn primary" id="saveAll" type="button">Save all slides</button>
      <button class="btn" id="exportProject" type="button">Save project file</button>
      <button class="btn" id="importProject" type="button">Open project file</button>
      <button class="btn warn" id="reset" type="button">Start over</button>

  </header>

  <section class="settings" aria-label="Carousel settings">

      <div class="seg" role="group" aria-label="Slide look">

        <button type="button" id="theme-paper" data-theme-btn="paper">Paper</button>
      </div>
    </div>
  </section>

  <div class="help" role="note">
    <span><b>Screenshots:</b>&nbsp;tap the empty window, drop a file on it, or paste</span>
    <span><b>Notes:</b>&nbsp;drag to move, tap to aim</span>
    <span><b>Round handle</b>&nbsp;sets where the arrow points; <b>&nbsp;diamond</b>&nbsp;bends it</span>
    <span><b>Tall screenshot?</b>&nbsp;drag it up or down inside the window</span>
  </div>

  <div class="slides" id="slides"></div>

  <div class="add-row">
    <button class="btn" id="addPage" type="button">+ Add a page slide</button>
  </div>
</div>
<input type="file" id="shotFile" class="hidden-input" accept="image/*">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script>
(() => {
const W = 1920, H = 1080, KEY = 'breakdown-carousel-v1';
const FRAME = {
  cover: { x: 1000, y: 262, w: 840 },
  page:  { x: 390,  y: 206, w: 1140 },
};
const contentH = w => Math.round(w * 10 / 16);

let uid = 0; const id = () => 'n' + (Date.now().toString(36)) + (uid++);
const note = (head, body, x, y, tx, ty, extra = {}) => ({ id: id(), head, body, x, y, tx, ty, bend: 40, style: 'curve', circle: false, ...extra });

function pageSlide(eyebrow, title, url, notes) {

}
function defaults() {

      pageSlide('Home page', 'First impression', 'lavidaphotobooth.com', [
        note('Says what they do in 3 seconds', 'Headline and event types, right up front', 60, 300, 640, 470, { bend: -50 }),
        note('Real event photos, no stock', 'Shot at their own weddings and parties', 60, 690, 760, 780, { style: 'loop', bend: 60 }),
        note('Book Now, always in reach', 'Pinned in the header on every page', 1576, 262, 1440, 300, { circle: true, bend: -30 }),
        note('Built for phones first', 'Most visitors arrive on a phone', 1576, 690, 1330, 860, { bend: 50 }),

      pageSlide('Booths & packages', 'Pick your booth', 'lavidaphotobooth.com/booths', [
        note('Every booth gets its own spotlight', 'Photos, features and what is included', 60, 300, 620, 520, { bend: -40 }),
        note('Pricing up front', 'Fewer back-and-forth emails', 1576, 300, 1350, 560, { circle: true, bend: 40 }),
        note('Add-ons that grow the order', 'Props, backdrops, extra hours', 60, 700, 820, 850, { style: 'loop', bend: 60 }),
      ]),
      pageSlide('Gallery', 'Show the party', 'lavidaphotobooth.com/gallery', [
        note('Photos that sell the experience', 'Grouped by event type', 60, 320, 700, 560, { bend: -40 }),
        note('Fast, even with 100+ photos', 'Compressed and loaded as you scroll', 1576, 330, 1300, 480, { bend: 40 }),
        note('No dead ends', 'Every section ends at booking', 1576, 720, 1180, 900, { style: 'loop', bend: -60 }),
      ]),
      pageSlide('Booking', 'Lock in the date', 'lavidaphotobooth.com/book', [
        note('A short form gets more inquiries', 'Name, date, venue, booth. Done.', 60, 330, 720, 560, { circle: true, bend: -40 }),
        note('Instant confirmation', 'Guests know it went through', 1576, 360, 1250, 800, { bend: 50 }),
        note('Leads land in the inbox', 'Nothing gets lost in the DMs', 60, 740, 640, 880, { style: 'loop', bend: 60 }),
      ]),
      { id: id(), kind: 'cta', eyebrow: 'Triseno / Web Design', title: 'Want a site\nlike this?', script: 'your business could be next',
        body: 'Custom websites for local businesses, built to get you booked.', button: 'Start a Conversation',
        tiles: ['Custom design', 'Made for phones', 'Booking built in', 'Found on Google'],
        notes: [ note("what's included", '', 1196, 128, 1250, 318, { style: 'loop', bend: -60 }) ] },
    ],
  };
}

/* ---------- state ---------- */
let S = load() || defaults();
let sel = null;          // { s: slideIndex, n: noteId }
let activeSlide = 1;     // target for paste
let pendingShotSlide = null;

function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
let saveTimer;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch {
      try { localStorage.setItem(KEY, JSON.stringify({ ...S, slides: S.slides.map(s => ({ ...s, img: null })) })); } catch {}
    }
  }, 500);
}

/* ---------- helpers ---------- */
const $ = (q, el = document) => el.querySelector(q);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
const pad = n => String(n).padStart(2, '0');
function getPath(obj, path) { return path.split('.').reduce((o, k) => o?.[k], obj); }

/* ---------- slide markup ---------- */
function frameHTML(s, f) {
  const ch = contentH(f.w);
  const img = s.img
    ? `<img src="${s.img}" alt="" style="object-position:50% ${s.imgY}%">`
    : `<div class="empty" data-pick="1"><div class="sq">+</div><b>Add the ${esc(s.kind === 'cover' ? 'home page' : s.eyebrow)} screenshot</b><small>Tap, drop a file, or paste</small></div>`;
  return `<div class="frame" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${ch + 54}px">
    <div class="offset"></div>
    <div class="win"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="urlbar" data-bind="url">${esc(s.url)}</div></div>
    <div class="shot" data-drag="img" style="height:${ch}px">${img}</div></div></div>`;
}

function slideHTML(s, i) {
  const total = S.slides.length;
  const lock = `<div class="lockup">Triseno<span>/ Web Design <i></i></span></div>`;
  const notes = s.notes.map(n => `<div class="note${sel && sel.n === n.id ? ' sel' : ''}" data-drag="note" data-note="${n.id}" style="left:${n.x}px;top:${n.y}px">
      <div class="nh" data-bind="notes.${s.notes.indexOf(n)}.head">${esc(n.head)}</div><div class="nb" data-bind="notes.${s.notes.indexOf(n)}.body">${esc(n.body)}</div></div>`).join('');
  let inner = '';
  if (s.kind === 'cover') {
    inner = `<div class="bg" style="--gx:74%;--gy:52%"></div><div class="grid"></div>${lock}
      <div class="eyebrow" style="left:96px;top:120px" data-bind="eyebrow">${esc(s.eyebrow)}</div>
      <div class="title" data-fit="840" style="left:92px;top:176px;font-size:112px" data-bind="title">${esc(s.title)}</div>
      <div class="script" data-fit="820" style="left:100px;top:452px;font-size:84px;transform:rotate(-4deg)" data-bind="script">${esc(s.script)}</div>
      <div class="body" style="left:96px;top:580px;width:680px" data-bind="body">${esc(s.body)}</div>
      ${frameHTML(s, FRAME.cover)}
      <div class="foot"><span data-bind="#site">${esc(S.site)}</span><span><b>01</b> / ${pad(total)}</span></div>`;
  } else if (s.kind === 'page') {
    inner = `<div class="bg"></div><div class="grid"></div>${lock}
      <div class="eyebrow" style="left:392px;top:62px"><span>${pad(i + 1)}</span> — <span data-bind="eyebrow">${esc(s.eyebrow)}</span></div>
      <div class="title" data-fit="1100" style="left:390px;top:104px;font-size:60px" data-bind="title">${esc(s.title)}</div>
      ${frameHTML(s, FRAME.page)}
      <div class="foot"><span data-bind="#site">${esc(S.site)}</span><span><span data-bind="#handle">${esc(S.handle)}</span>&nbsp;&nbsp;<b>${pad(i + 1)}</b> / ${pad(total)}</span></div>`;
  } else {
    inner = `<div class="bg" style="--gx:30%;--gy:50%"></div><div class="grid"></div>${lock}
      <div class="script" data-fit="900" style="left:100px;top:196px;font-size:80px;transform:rotate(-4deg)" data-bind="script">${esc(s.script)}</div>
      <div class="title" data-fit="900" style="left:92px;top:300px;font-size:118px" data-bind="title">${esc(s.title)}</div>
      <div class="body" style="left:96px;top:580px;width:700px" data-bind="body">${esc(s.body)}</div>
      <div class="cta-btn" style="left:96px;top:740px" ><span data-bind="button">${esc(s.button)}</span><svg viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M0 10H37M28 2L37 10L28 18"/></svg></div>
      <div class="tiles" style="left:1100px;top:330px;width:720px">${s.tiles.map((t, k) => `<div class="tile"><i></i><b data-bind="tiles.${k}">${esc(t)}</b></div>`).join('')}</div>
      <div class="foot"><span data-bind="#site">${esc(S.site)}</span><span><b>${pad(i + 1)}</b> / ${pad(total)}</span></div>`;
  }
  return inner + `<svg class="arrows" viewBox="0 0 ${W} ${H}" aria-hidden="true"></svg>` + notes;
}

/* ---------- hand-drawn arrows ---------- */
function noteBox(el) { return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; }
function startPoint(b, tx, ty) {
  if (tx > b.x + b.w) return [b.x + b.w + 18, b.y + 30];
  if (tx < b.x) return [b.x - 18, b.y + 30];
  if (ty > b.y + b.h) return [b.x + b.w / 2, b.y + b.h + 16];
  return [b.x + b.w / 2, b.y - 16];
}
const RX = 88, RY = 56;
function curve(n, sx, sy) {
  let ex = n.tx, ey = n.ty;
  if (n.circle) {
    const ang = Math.atan2(sy - ey, sx - ex);
    const r = (RX * RY) / Math.hypot(RY * Math.cos(ang), RX * Math.sin(ang));
    ex += Math.cos(ang) * (r + 14); ey += Math.sin(ang) * (r + 14);
  }
  const dx = ex - sx, dy = ey - sy, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  const cx = (sx + ex) / 2 + nx * n.bend * 2, cy = (sy + ey) / 2 + ny * n.bend * 2;
  const B = t => [(1 - t) ** 2 * sx + 2 * (1 - t) * t * cx + t * t * ex, (1 - t) ** 2 * sy + 2 * (1 - t) * t * cy + t * t * ey];
  const D = t => [2 * (1 - t) * (cx - sx) + 2 * t * (ex - cx), 2 * (1 - t) * (cy - sy) + 2 * t * (ey - cy)];
  const a = 0.36, b = 0.64, r = Math.min(64, Math.max(22, L * 0.065));
  const side = n.bend >= 0 ? 1 : -1;
  const pts = [];
  for (let k = 0; k <= 120; k++) {
    const t = k / 120; let [x, y] = B(t);
    if (n.style === 'loop' && L > 200 && t > a && t < b) {
      const th = 2 * Math.PI * (t - a) / (b - a);
      let [tx, ty] = D(t); const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const px = -ty * side, py = tx * side;
      x += -r * Math.sin(th) * tx + r * (1 - Math.cos(th)) * px;
      y += -r * Math.sin(th) * ty + r * (1 - Math.cos(th)) * py;
    }
    pts.push([x, y]);
  }
  let [ux, uy] = D(1); const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
  const head = (deg, len) => { const c = Math.cos(deg), s = Math.sin(deg); return [ex - len * (ux * c - uy * s), ey - len * (ux * s + uy * c)]; };
  const h1 = head(0.5, 34), h2 = head(-0.44, 30);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
  const hd = `M${h1[0].toFixed(1)} ${h1[1].toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}L${h2[0].toFixed(1)} ${h2[1].toFixed(1)}`;
  return { d, hd, mid: B(0.5) };
}
function ellipsePath(cx, cy) {
  const pts = [];
  for (let k = 0; k <= 70; k++) {
    const th = -0.9 + (k / 70) * (Math.PI * 2 + 0.55);
    const w = 1 + 0.05 * Math.sin(th * 2.3) + (k / 70) * 0.07;
    pts.push([cx + RX * w * Math.cos(th), cy + RY * w * Math.sin(th)]);
  }
  return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
}
function drawArrows(i) {
  const s = S.slides[i], el = slideEl(i); if (!el) return;
  const svg = $('svg.arrows', el); let out = '';
  const st = getComputedStyle(el);
  const cs = { halo: st.getPropertyValue('--s-halo').trim(), accent: st.getPropertyValue('--s-accent').trim() };
  el.querySelectorAll('.h,.notebar').forEach(h => h.remove());
  s.notes.forEach(n => {
    const nEl = el.querySelector(`[data-note="${n.id}"]`); if (!nEl) return;
    const [sx, sy] = startPoint(noteBox(nEl), n.tx, n.ty);
    const c = curve(n, sx, sy);
    const halo = `stroke="${cs.halo}" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
    const ink = `stroke="${cs.accent}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
    if (n.circle) {
      const e = ellipsePath(n.tx, n.ty);
      out += `<path d="${e}" ${halo}/><path d="${e}" ${ink} stroke-width="5"/>`;
    }
    out += `<path d="${c.d}" ${halo}/><path d="${c.hd}" ${halo}/>`;
    out += `<path d="${c.d}" ${ink} stroke-width="5"/><path d="${c.hd}" ${ink} stroke-width="5"/>`;
    out += `<path d="${c.d}" ${ink} stroke-width="1.6" opacity=".45" transform="translate(2.5 -2)"/>`;
    if (sel && sel.s === i && sel.n === n.id) {
      el.insertAdjacentHTML('beforeend',
        `<div class="h h-bend ui" data-drag="bend" data-note="${n.id}" style="left:${c.mid[0]}px;top:${c.mid[1]}px" title="Bend the arrow"></div>
         <div class="h h-target ui" data-drag="target" data-note="${n.id}" style="left:${n.tx}px;top:${n.ty}px" title="Where the arrow points"></div>
         <div class="notebar ui" style="left:${n.x}px;top:${n.y}px">
           <button type="button" data-act="style" aria-pressed="${n.style === 'loop'}">Loop</button>
           <button type="button" data-act="circle" aria-pressed="${n.circle}">Circle it</button>
           <button type="button" data-act="flip">Flip bend</button>
           <button type="button" class="del" data-act="del">Delete</button>
         </div>`);
    }
  });
  svg.innerHTML = out;
}

/* ---------- title fitting ---------- */
function fitTitles(el) {
  el.querySelectorAll('[data-fit]').forEach(t => {
    const max = +t.dataset.fit;
    const base = parseFloat(t.dataset.base || t.style.fontSize); t.dataset.base = base;
    let size = base; t.style.fontSize = size + 'px';
    while (t.scrollWidth > max && size > 24) { size -= 2; t.style.fontSize = size + 'px'; }
  });
}

/* ---------- cards ---------- */
const slidesEl = $('#slides');
const slideEl = i => slidesEl.children[i]?.querySelector('.slide');
function kindLabel(s) { return s.kind === 'cover' ? 'Cover' : s.kind === 'cta' ? 'Closing slide' : s.eyebrow || 'Page'; }

function fieldHTML(i, key, label, val, multi) {
  const fid = `f-${S.slides[i].id}-${key.replace(/\./g, '-')}`;
  return `<label class="field"><span>${label}</span>${multi
    ? `<textarea id="${fid}" data-key="${key}" rows="2">${esc(val)}</textarea>`
    : `<input id="${fid}" type="text" data-key="${key}" value="${esc(val)}">`}</label>`;
}
function editHTML(i) {
  const s = S.slides[i]; let h = '';
  if (s.kind !== 'cta') h += fieldHTML(i, 'eyebrow', s.kind === 'cover' ? 'Small label' : 'Page name', s.eyebrow);
  h += fieldHTML(i, 'title', 'Headline (new line = line break)', s.title, true);
  if (s.kind !== 'page') h += fieldHTML(i, 'script', 'Handwritten line', s.script);
  if (s.kind !== 'page') h += fieldHTML(i, 'body', 'Sentence', s.body, true);
  if (s.kind !== 'cta') h += fieldHTML(i, 'url', 'Address bar', s.url);
  if (s.kind === 'cta') { h += fieldHTML(i, 'button', 'Button', s.button); s.tiles.forEach((t, k) => { h += fieldHTML(i, `tiles.${k}`, `Box ${k + 1}`, t); }); }
  s.notes.forEach((n, k) => {
    h += `<div class="group"><span>Note ${k + 1}</span><button type="button" data-delnote="${n.id}">Remove</button></div>`;
    h += fieldHTML(i, `notes.${k}.head`, 'Handwritten', n.head, true);
    h += fieldHTML(i, `notes.${k}.body`, 'Small print (optional)', n.body, true);
  });
  return h;
}
function cardHTML(s, i) {
  const n = S.slides.length;
  return `<article class="card" data-i="${i}">
    <div class="card-head">
      <div class="label"><b>${pad(i + 1)}</b>${esc(kindLabel(s))}</div>
      <div class="tools">
        ${s.kind !== 'cta' ? `<button class="btn" type="button" data-cmd="shot">${s.img ? 'Replace' : 'Add'} screenshot</button>` : ''}
        <button class="btn" type="button" data-cmd="addnote">+ Note</button>
        <button class="btn" type="button" data-cmd="up" ${i === 0 ? 'disabled' : ''} aria-label="Move slide earlier">←</button>
        <button class="btn" type="button" data-cmd="down" ${i === n - 1 ? 'disabled' : ''} aria-label="Move slide later">→</button>
        ${s.kind === 'page' ? `<button class="btn" type="button" data-cmd="dup">Duplicate</button><button class="btn warn" type="button" data-cmd="del">Delete</button>` : ''}
        <button class="btn" type="button" data-cmd="preview">Preview</button>
        <button class="btn primary" type="button" data-cmd="save">Save PNG</button>
      </div>
    </div>
    <div class="stage"><div class="slide ${S.theme}">${slideHTML(s, i)}</div></div>
    <details class="edit"><summary>Edit the words</summary><div class="edit-body">${editHTML(i)}</div></details>
  </article>`;
}

const ro = new ResizeObserver(entries => entries.forEach(e => scaleStage(e.target)));
function scaleStage(stage) {
  const sc = stage.clientWidth / W; const sl = stage.firstElementChild;
  stage.style.height = H * sc + 'px';
  sl.style.transform = `scale(${sc})`; sl.style.setProperty('--inv', (1 / sc).toFixed(3));
}
function renderAll() {
  const open = [...slidesEl.querySelectorAll('details.edit')].map(d => d.open);
  slidesEl.innerHTML = S.slides.map(cardHTML).join('');
  slidesEl.querySelectorAll('.stage').forEach((st, i) => { scaleStage(st); ro.observe(st); if (open[i]) st.parentElement.querySelector('details').open = true; });
  S.slides.forEach((_, i) => { fitTitles(slideEl(i)); drawArrows(i); });
  syncSettings(); persist();
}
function renderOne(i) {
  const card = slidesEl.children[i]; const open = card.querySelector('details').open;
  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(S.slides[i], i);
  const fresh = tmp.firstElementChild; card.replaceWith(fresh);
  fresh.querySelector('details').open = open;
  const st = fresh.querySelector('.stage'); scaleStage(st); ro.observe(st);
  fitTitles(slideEl(i)); drawArrows(i); persist();
}
function syncSettings() {
  $('#set-name').value = S.name; $('#set-site').value = S.site; $('#set-handle').value = S.handle;
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === S.theme)));
}

/* ---------- text edits (no full re-render, keeps the caret) ---------- */
slidesEl.addEventListener('input', e => {
  const key = e.target.dataset.key; if (!key) return;
  const i = +e.target.closest('.card').dataset.i; const s = S.slides[i];
  setPath(s, key, e.target.value);
  const el = slideEl(i); const node = el.querySelector(`[data-bind="${key}"]`);
  if (node) node.textContent = e.target.value;
  if (key === 'eyebrow') slidesEl.children[i].querySelector('.label').innerHTML = `<b>${pad(i + 1)}</b>${esc(kindLabel(s))}`;
  fitTitles(el); drawArrows(i); persist();
});
['name', 'site', 'handle'].forEach(k => $('#set-' + k).addEventListener('input', e => {
  S[k] = e.target.value;
  if (k !== 'name') document.querySelectorAll(`[data-bind="#${k}"]`).forEach(n => { n.textContent = S[k]; });
  persist();
}));
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
  S.theme = b.dataset.themeBtn; renderAll();
}));

/* ---------- card commands ---------- */
slidesEl.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const i = +card.dataset.i; activeSlide = i;
  const dn = e.target.closest('[data-delnote]');
  if (dn) { removeNote(i, dn.dataset.delnote); return; }
  const actBtn = e.target.closest('[data-act]');
  if (actBtn && sel) { noteAction(i, actBtn.dataset.act); return; }
  if (e.target.closest('[data-pick]')) { pickShot(i); return; }
  const cmd = e.target.closest('[data-cmd]')?.dataset.cmd; if (!cmd) return;
  const s = S.slides[i];
  if (cmd === 'shot') pickShot(i);
  else if (cmd === 'addnote') {
    const n = note('New note', '', 80, 470, s.kind === 'cta' ? 1300 : 700, 560);
    s.notes.push(n); sel = { s: i, n: n.id }; renderOne(i);
    card.querySelector('details').open = true;
  }
  else if (cmd === 'up' || cmd === 'down') {
    const j = cmd === 'up' ? i - 1 : i + 1; [S.slides[i], S.slides[j]] = [S.slides[j], S.slides[i]]; sel = null; renderAll();
  }
  else if (cmd === 'dup') {
    const copy = JSON.parse(JSON.stringify(s)); copy.id = id(); copy.notes.forEach(n => { n.id = id(); });
    S.slides.splice(i + 1, 0, copy); renderAll();
  }
  else if (cmd === 'del') {
    const b = e.target.closest('button');
    if (b.dataset.armed) { S.slides.splice(i, 1); sel = null; renderAll(); toast('Slide deleted'); }
    else { b.dataset.armed = '1'; b.textContent = 'Tap to confirm'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Delete'; } }, 3000); }
  }
  else if (cmd === 'preview') exportSlide(i, 'preview');
  else if (cmd === 'save') exportSlide(i, 'save');
});
function removeNote(i, nid) {
  const s = S.slides[i]; s.notes = s.notes.filter(n => n.id !== nid);
  if (sel && sel.n === nid) sel = null; renderOne(i);
}
function noteAction(i, act) {
  const n = S.slides[i].notes.find(x => x.id === sel.n); if (!n) return;
  if (act === 'del') return removeNote(i, n.id);
  if (act === 'style') n.style = n.style === 'loop' ? 'curve' : 'loop';
  if (act === 'circle') n.circle = !n.circle;
  if (act === 'flip') n.bend = -n.bend;
  drawArrows(i); persist();
}
$('#addPage').addEventListener('click', () => {
  const at = S.slides[S.slides.length - 1]?.kind === 'cta' ? S.slides.length - 1 : S.slides.length;
  S.slides.splice(at, 0, pageSlide('New page', 'Page headline', S.slides[1]?.url || 'yourclient.com', [
    note('What this part does', 'Why it matters to the customer', 60, 320, 680, 520, { bend: -40 }),
    note('Another detail', '', 1576, 420, 1300, 640, { bend: 40 }),
  ]));
  renderAll(); slidesEl.children[at].scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ---------- dragging: notes, arrow handles, screenshot pan ---------- */
let drag = null;
slidesEl.addEventListener('pointerdown', e => {
  const slide = e.target.closest('.slide'); if (!slide) return;
  if (e.target.closest('.notebar')) return;
  const card = slide.closest('.card'); const i = +card.dataset.i; activeSlide = i;
  const h = e.target.closest('[data-drag]');
  if (!h) { if (sel) { sel = null; slide.querySelectorAll('.note.sel').forEach(n => n.classList.remove('sel')); drawArrows(i); } return; }
  const kind = h.dataset.drag; const s = S.slides[i];
  if (kind === 'img' && !s.img) return;
  const sc = slide.getBoundingClientRect().width / W;
  const n = h.dataset.note ? s.notes.find(x => x.id === h.dataset.note) : null;
  drag = { kind, i, s, n, sc, x0: e.clientX, y0: e.clientY, moved: false, el: h, slide,
           start: n ? { x: n.x, y: n.y, tx: n.tx, ty: n.ty } : { imgY: s.imgY } };
  if (kind === 'img') {
    const img = h.querySelector('img'); const shown = img.naturalHeight * (h.clientWidth / img.naturalWidth);
    drag.range = Math.max(0, shown - h.clientHeight);
  }
  slide.setPointerCapture(e.pointerId);
  e.preventDefault();
});
slidesEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = (e.clientX - drag.x0) / drag.sc, dy = (e.clientY - drag.y0) / drag.sc;
  if (!drag.moved && Math.hypot(dx, dy) * drag.sc < 4) return;
  drag.moved = true;
  const { n } = drag;
  if (drag.kind === 'note') {
    n.x = Math.round(Math.min(W - 60, Math.max(-40, drag.start.x + dx)));
    n.y = Math.round(Math.min(H - 40, Math.max(0, drag.start.y + dy)));
    drag.el.style.left = n.x + 'px'; drag.el.style.top = n.y + 'px';
    drawArrows(drag.i);
  } else if (drag.kind === 'target') {
    n.tx = Math.round(Math.min(W, Math.max(0, drag.start.tx + dx)));
    n.ty = Math.round(Math.min(H, Math.max(0, drag.start.ty + dy)));
    drawArrows(drag.i);
  } else if (drag.kind === 'bend') {
    const r = drag.slide.getBoundingClientRect();
    const px = (e.clientX - r.left) / drag.sc, py = (e.clientY - r.top) / drag.sc;
    const nEl = drag.slide.querySelector(`[data-note="${n.id}"].note`);
    const [sx, sy] = startPoint(noteBox(nEl), n.tx, n.ty);
    const ddx = n.tx - sx, ddy = n.ty - sy, L = Math.hypot(ddx, ddy) || 1;
    const dist = ((px - (sx + n.tx) / 2) * -ddy + (py - (sy + n.ty) / 2) * ddx) / L;
    n.bend = Math.round(Math.max(-400, Math.min(400, dist)));
    drawArrows(drag.i);
  } else if (drag.kind === 'img' && drag.range > 0) {
    const pct = drag.start.imgY - (dy / drag.range) * 100;
    drag.s.imgY = Math.round(Math.max(0, Math.min(100, pct)) * 10) / 10;
    drag.el.querySelector('img').style.objectPosition = `50% ${drag.s.imgY}%`;
  }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind === 'note' && !d.moved) {
    sel = sel && sel.n === d.n.id ? null : { s: d.i, n: d.n.id };
    d.slide.querySelectorAll('.note').forEach(x => x.classList.toggle('sel', !!sel && x.dataset.note === sel.n));
    drawArrows(d.i);
  }
  if (d.moved) persist();
}
slidesEl.addEventListener('pointerup', endDrag);
slidesEl.addEventListener('pointercancel', endDrag);

/* ---------- screenshots in ---------- */
function pickShot(i) { pendingShotSlide = i; $('#shotFile').value = ''; $('#shotFile').click(); }
$('#shotFile').addEventListener('change', e => { const f = e.target.files[0]; if (f && pendingShotSlide != null) setShot(pendingShotSlide, f); });
function setShot(i, file) {
  if (!file || !file.type.startsWith('image/')) { toast('That file is not an image'); return; }
  if (S.slides[i].kind === 'cta') { toast('The closing slide has no screenshot window'); return; }
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => {
    const max = 2880, k = Math.min(1, max / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    S.slides[i].img = c.toDataURL('image/jpeg', 0.9); S.slides[i].imgY = 0; renderOne(i); toast('Screenshot added');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Could not read that image'); };
  img.src = url;
}
slidesEl.addEventListener('dragover', e => { const st = e.target.closest('.stage'); if (!st) return; e.preventDefault(); st.classList.add('drop'); });
slidesEl.addEventListener('dragleave', e => { e.target.closest('.stage')?.classList.remove('drop'); });
slidesEl.addEventListener('drop', e => {
  const st = e.target.closest('.stage'); if (!st) return; e.preventDefault(); st.classList.remove('drop');
  const f = e.dataTransfer.files[0]; if (f) setShot(+st.closest('.card').dataset.i, f);
});
document.addEventListener('paste', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); setShot(activeSlide, f); }
});

/* ---------- export ---------- */
let dlPromise;
function downloadsApi() {
  if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
  return dlPromise ||= window.claude.use('downloads').catch(() => null);
}
function fileName(i) {
  const base = (S.name || 'carousel').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'carousel';
  return `${base}-${pad(i + 1)}.png`;
}
async function renderPng(i) {
  if (!window.htmlToImage) throw new Error('lib');
  const prev = sel; sel = null; drawArrows(i);
  const el = slideEl(i); el.querySelectorAll('.note.sel').forEach(n => n.classList.remove('sel'));
  const opts = { width: W, height: H, pixelRatio: 1, style: { transform: 'none' },
    filter: n => !(n.classList && n.classList.contains('ui')) };
  try {
    await document.fonts.ready;
    await htmlToImage.toBlob(el, opts);            // first pass warms images and fonts (Safari needs it)
    return await htmlToImage.toBlob(el, opts);
  } finally {
    sel = prev; if (prev && prev.s === i) { el.querySelector(`[data-note="${prev.n}"].note`)?.classList.add('sel'); } drawArrows(i);
  }
}
function showPreview(blob, name, msg) {
  const url = URL.createObjectURL(blob);
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', 'Slide preview');
  m.innerHTML = `<img src="${url}" alt="${esc(name)}"><p>${esc(msg || 'On a phone, press and hold the image to save it to Photos.')}</p>
    <div class="actions"><button class="btn" type="button">Close</button></div>`;
  const close = () => { m.remove(); URL.revokeObjectURL(url); };
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('button')) close(); });
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
  document.body.appendChild(m);
}
async function saveBlob(blob, name) {
  const dl = await downloadsApi();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; }
    catch (err) {
      if (err && err.code === 'declined') { toast('Save cancelled'); return false; }
      if (err && err.code === 'rate_limited') { toast('One save at a time. Try again in a moment.'); return false; }
    }
    showPreview(blob, name, 'Saving is not available here. Press and hold (or right-click) the image to save it.');
    return false;
  }
  if (!window.claude) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }
  showPreview(blob, name, 'Press and hold (or right-click) the image to save it.');
  return false;
}
async function exportSlide(i, mode) {
  let blob;
  try { toast('Rendering slide ' + (i + 1) + '…'); blob = await renderPng(i); }
  catch { toast('Could not render the slide. Check your connection and reload.'); return false; }
  if (mode === 'preview') { showPreview(blob, fileName(i)); return true; }
  const ok = await saveBlob(blob, fileName(i));
  if (ok) toast('Saved ' + fileName(i));
  return ok;
}
$('#saveAll').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true;
  let saved = 0;
  for (let i = 0; i < S.slides.length; i++) { if (await exportSlide(i, 'save')) saved++; else break; }
  b.disabled = false; toast(`Saved ${saved} of ${S.slides.length} slides`);
});

/* ---------- project file ---------- */
$('#exportProject').addEventListener('click', async () => {
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const name = fileName(0).replace(/-01\.png$/, '-project.json');
  const dl = await downloadsApi();
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast('Project saved'); } catch (err) { if (err?.code !== 'declined') toast('Could not save the project file here'); } return; }
  if (!window.claude) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); toast('Project saved'); }
  else toast('Could not save the project file here');
});
$('#importProject').addEventListener('click', () => { $('#projectFile').value = ''; $('#projectFile').click(); });
$('#projectFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!Array.isArray(data.slides)) throw 0; S = data; sel = null; renderAll(); toast('Project opened'); }
  catch { toast('That file is not a carousel project'); }
});
$('#reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.armed) { S = defaults(); sel = null; renderAll(); toast('Started over'); delete b.dataset.armed; b.textContent = 'Start over'; return; }
  b.dataset.armed = '1'; b.textContent = 'Tap again to clear everything';
  setTimeout(() => { delete b.dataset.armed; b.textContent = 'Start over'; }, 3500);
});

renderAll();
document.fonts.ready.then(() => S.slides.forEach((_, i) => { fitTitles(slideEl(i)); drawArrows(i); }));
})();
</script>

</body>
</html>
